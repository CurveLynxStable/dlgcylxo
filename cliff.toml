[changelog]
body = """
## {{ version | default(value="Unreleased") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% set grouped = commits | group_by(attribute="group") %}{% for group in [":sparkles: Новые возможности", ":bug: Исправления", ":art: Стиль интерфейса"] %}{% set items = grouped | get(key=group, default=[]) %}{% if items %}
### {{ group }}
{% for commit in items %}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}{% endif %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-.*)?$"

commit_parsers = [
  # Не допускаем повторного попадания автокоммитов в последующий changelog
  { message = "^docs\\(changelog\\):", skip = true },

  { message = "^feat(\\(.+\\))?(!)?:\\s", group = ":sparkles: Новые возможности" },
  { message = "^fix(\\(.+\\))?(!)?:\\s", group = ":bug: Исправления" },
  { message = "^style(\\(.+\\))?(!)?:\\s", group = ":art: Стиль интерфейса" },

  # Остальные типы игнорируются — в соответствии с действующими правилами репозитория
  { message = ".*", skip = true },
]
