name: 🔌 Сбой подключения/создания модели (сторона Trae)
description: Проблемы подключения в Trae («не удалось добавить модель/проблема с сетью/сбой создания» и т.п.)
title: "[Conn] Краткое описание"
labels: ["area:connection"]
body:
  - type: checkboxes
    id: precheck
    attributes:
      label: Предварительная проверка (подтвердите каждый пункт)
      options:
        - label: "hosts содержит `127.0.0.1 api.openai.com` и строка не закомментирована (не начинается с #)"
          required: true
        - label: Подтверждено, что порт 443 не занят другим процессом
          required: true
        - label: В API URL указан только домен (без `/v1`)
          required: true
        - label: Локальный CA-сертификат установлен и является доверенным (диспетчер сертификатов Windows / Связка ключей macOS)
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Операционная система
      options: [Windows 10/11, macOS Apple Silicon, macOS Intel, Linux]
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: Информация о системе и ядре (обязательно вставьте вывод команды)
      description: |
        - macOS / Linux: вставьте полный вывод `uname -mprs`
        - Windows (PowerShell): вставьте полный вывод команды:
          `Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture`
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Информация о версиях
      placeholder: MTGA GUI vX.Y.Z / Trae vA.B.C
    validations:
      required: true
  - type: input
    id: apiurl
    attributes:
      label: Ваш API URL
      placeholder: https://your-api.example.com
    validations:
      required: true
  - type: input
    id: mapped_model
    attributes:
      label: ID модели, сопоставленной в Trae
      placeholder: например gpt-4o / deepseek-chat / ...
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения (обязательно конкретные)
      placeholder: |
        1. Открыть MTGA -> Запуск одним щелчком
        2. Trae -> Добавить модель -> ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Связанные логи и скриншоты
      description: Рекомендуется включить вывод консоли MTGA, всплывающие окна Trae, логи сервера (при необходимости блоком кода)
      render: shell
