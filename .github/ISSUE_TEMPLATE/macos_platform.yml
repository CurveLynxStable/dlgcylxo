name: 🍎 macOS установочный пакет не открывается/«повреждён»
description: Только для проблем macOS, связанных с подписью/карантином пакета (блокировка открытия, сообщение о повреждении и т.п.)
title: "[macOS] Пакет повреждён/не открывается - краткое описание"
labels: ["platform:macOS"]
body:
  - type: dropdown
    id: arch
    attributes:
      label: Архитектура устройства
      options: [Apple Silicon (arm64), Intel (x86_64)]
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: Информация о системе и ядре (обязательно вставьте вывод команды)
      description: Вставьте полный вывод `uname -mprs`
      render: shell
    validations:
      required: true
  - type: input
    id: file_name
    attributes:
      label: Имя файла установочного пакета или версия из приложения
      placeholder: MTGA_GUI-vX.Y.Z-aarch64.dmg / номер версии в приложении
    validations:
      required: true
  - type: checkboxes
    id: tried
    attributes:
      label: Вы уже пробовали
      description: Если не знаете как — нажмите «Решение», чтобы быстро посмотреть шаги
      options:
        - label: Я выполнил действия из «[Решения](https://github.com/BiFangKNT/mtga?tab=readme-ov-file#macos-%E8%A7%A3%E5%86%B3-%E5%8C%85%E5%B7%B2%E6%8D%9F%E5%9D%8F-%E9%97%AE%E9%A2%98)»
          required: true
        - label: Снял атрибут карантина (например `xattr -dr com.apple.quarantine /Applications/MTGA.app`)
          required: true
  - type: textarea
    id: details
    attributes:
      label: Конкретный текст ошибки и скриншоты
      placeholder: Включите системные всплывающие окна, вывод консоли и т.д.
      render: shell
