name: 🐞 Bug Report (общий)
description: Сбой/краш/неправильная работа, не подпадающие под категории ниже
title: "[BUG] Краткий заголовок"
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Операционная система
      options: [Windows 10/11, macOS Apple Silicon, macOS Intel, Linux]
    validations:
      required: true
  - type: textarea
    id: sysinfo
    attributes:
      label: Информация о системе и ядре (обязательно вставьте вывод команды)
      description: |
        - macOS / Linux: вставьте полный вывод `uname -mprs`
        - Windows (PowerShell): вставьте полный вывод команды:
          `Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture`
      render: shell
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Информация о версиях
      placeholder: MTGA GUI vX.Y.Z / Trae vA.B.C
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Краткое описание
      placeholder: Кратко опишите проблему и её влияние
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: 1) … 2) … 3) …
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Ожидаемое vs фактическое
      placeholder: "Ожидалось: …; Фактически: …"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Связанные логи/скриншоты (можно блоком кода)
      render: shell
