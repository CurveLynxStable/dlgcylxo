name: ✨ Запрос функции (Feature Request)
description: Предложите понятную, обсуждаемую и декомпозируемую функцию
title: "[Feat] Краткий заголовок"
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Контекст/проблема
      description: Какую проблему решает этот запрос? Где застревает текущий рабочий процесс?
      placeholder: Когда я…, мне нужно…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Ваше видение
      description: Опишите в общих чертах форму функции (UI, конфигурация, API и т.д.)
      placeholder: "Например: добавить на страницу настроек…; добавить опцию CLI…"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Испробованные альтернативы
      placeholder: Я пробовал…, но…
  - type: checkboxes
    id: scope
    attributes:
      label: Область влияния (можно несколько)
      options:
        - label: GUI
        - label: Скрипты/командная строка
        - label: Поведение на стороне Trae
        - label: Документация/примеры/FAQ
  - type: input
    id: metrics
    attributes:
      label: Критерии успеха (опционально)
      placeholder: Например «сократить XX шагов/настроек», «поддержать платформу YY»
