[package]
name = "mtga-tauri"
version = "2.6.0"
description = "Tauri-приложение MTGA"
authors = ["BiFangKNT"]
license = "AGPL-3.0-only"
repository = "."
edition = "2024"
rust-version = "1.85.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
pyo3 = "0.25"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-pytauri = { version = "0.8" }
tauri-plugin-shell = "2"

[profile.bundle-dev]
inherits = "dev"
incremental = true # Компилировать бинарник небольшими шагами.

[profile.bundle-release]
inherits = "release"
codegen-units = 1 # Позволяет LLVM выполнять лучшую оптимизацию.
lto = true # Включает оптимизацию на этапе линковки (LTO).
opt-level = 3 # Приоритет — малый размер бинарника. Если важнее скорость, используйте `3`.
panic = "abort" # Повышает производительность за счёт отключения обработчика panic.
#panic = "unwind"
strip = true # Гарантирует удаление отладочных символов.
